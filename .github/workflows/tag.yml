name: Publish to NPM
run-name: ${{ github.actor }} publish ${{ github.ref_name }}

# `v*` only. The Go module carries a `go/v*` tag for the same release, and
# matching it here would run this whole workflow a second time and try to
# publish versions npm already has.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
      - run: npm ci
      # Built before tested, and the order is not a preference: a package names
      # its neighbour by package name, and that resolves through the workspace
      # link to a `dist/` that does not exist until this step has run.
      - run: npm run build
      - run: npm test
      # In dependency order: the protocol first, since every other one names it.
      #
      # The first three carry `main`/`types` pointing into their own `dist`, so
      # the workspace root is the package. The Angular one does not: ng-packagr
      # writes the real manifest - the FESM bundle, the typings, the exports map
      # - into `dist`, and that directory *is* the package. Publishing the
      # workspace root there ships the sources and nothing that resolves.
      - run: npm publish --workspace @softwarity/livewire-protocol
      - run: npm publish --workspace @softwarity/livewire-mock
      - run: npm publish --workspace @softwarity/nestjs-livewire
      - run: npm publish ./packages/angular/dist
