name: Tests
run-name: ${{ github.actor }} run tests on ${{ github.repository }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          # The module is in go/, so its checksum file is not at the root where
          # the cache looks by default.
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test -race ./...
