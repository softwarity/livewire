name: Create Tag/Release
run-name: ${{ github.actor }} release ${{ github.repository }}

# One run, two tags. The wire contract is described in every package, in the Go
# module and in the Quarkus server, so they carry one version between them:
# `v1.2.3` publishes the npm packages and the Maven artifact (tag.yml), `go/v1.2.3`
# is what `go get` looks for on a module in a subdirectory. Posting one without the other is how a server and a client end
# up disagreeing about the protocol they share.
#
# The bump, the notes and the GitHub Release are `softwarity/release-flow`'s
# business, as everywhere else. What is specific to this repository - one
# version across four packages, and a second tag - is arranged around it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      # The PAT is what the action pushes with: a tag pushed by GITHUB_TOKEN
      # triggers no workflow, and tag.yml is what publishes to npm.
      # fetch-depth: 0 so the tags are visible.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      # The conformance suite drives the Quarkus fixture too: a JDK, or it skips itself.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Checked before anything is tagged: a token that expired turns a release
      # into a tag nobody can publish, and the tag is the hard part to undo.
      - name: Verify the npm token still works
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm whoami --registry https://registry.npmjs.org/

      # Same reason, for Maven Central: the Portal user token, then the signing key.
      # The query names a version that does not exist - all it has to do is not
      # answer 401.
      - name: Verify the Maven Central token and the signing key still work
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          curl -sSf -o /dev/null \
            -H "Authorization: Bearer $(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_TOKEN" | base64 -w0)" \
            "https://central.sonatype.com/api/v1/publisher/published?namespace=io.softwarity&name=quarkus-livewire&version=0.0.0"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo check | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --clearsign > /dev/null

      - run: npm ci

      # Before the build, not after: the doc site links the built packages, and
      # what it locks is the version written in their build output. Bumping
      # after building would leave that output a version behind, and the next
      # `npm ci` in docs would refuse the lockfile.
      #
      # The root manifest is left alone - it is what the action bumps, and what
      # it reads to know the version before.
      - name: Put every package on the version this release carries
        run: |
          NEXT=$(node -p "
            const [major, minor, patch] = require('./package.json').version.split('.').map(Number);
            ({ major: [major + 1, 0, 0], minor: [major, minor + 1, 0], patch: [major, minor, patch + 1] })['${{ inputs.bump }}'].join('.')
          ")
          node scripts/version-all.mjs "$NEXT"
          npm install --package-lock-only --ignore-scripts

      - run: npm run build
      - run: npm test

      # Staged rather than committed: release-flow commits the index as it
      # finds it, so all of this lands in the release commit and the tag
      # carries it.
      - name: Stage the version, and the lockfiles that record it
        run: |
          npm install --package-lock-only --ignore-scripts --prefix docs
          git add packages/*/package.json package-lock.json docs/package-lock.json quarkus/pom.xml quarkus/*/pom.xml

      - id: release
        uses: softwarity/release-flow@v1
        with:
          bump: ${{ inputs.bump }}

      # Go has no registry: the tag is the publication, and a module in a
      # subdirectory is fetched under `go/vX.Y.Z`. Same commit, same number.
      # Annotated, because a lightweight tag is skipped by `--follow-tags`.
      - name: Tag the Go module on the same commit
        run: |
          TAG="go/v${{ steps.release.outputs.version }}"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
