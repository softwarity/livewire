# The fixture the conformance suite drives: the socket at /ws, the port the suite picks.
quarkus.http.port=${PORT:8080}
quarkus.http.host=127.0.0.1
livewire.path=/ws
# No coalescing: these scenarios are about the protocol, not about how long a burst gathers.
livewire.coalesce=1ms
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.category."io.softwarity".level=INFO
